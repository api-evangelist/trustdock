aid: trustdock
name: Trustdock
description: >-
  TRUSTDOCK Inc. (株式会社TRUSTDOCK) is a Tokyo-based digital identity and eKYC
  (electronic Know Your Customer) provider founded in November 2017. The company
  delivers high-precision, fast, and low-cost online identity verification and
  digital ID infrastructure via API, serving more than 300 enterprise and
  government clients across finance, insurance, ride-sharing and car-sharing,
  telecommunications (MNO/MVNO), real-estate crowdfunding, second-hand/reuse
  goods, recruitment, matching apps, and public-sector onboarding. TRUSTDOCK
  offers both browser-based and mobile-app-based verification flows, holds ISMS
  (ISO 27001) certification and the Japanese PrivacyMark, and participates in the
  OpenID Foundation Japan KYC Working Group and the FIDO Alliance. Its API
  documentation is provided to customers under NDA rather than published to a
  public developer portal.
